          <form id="phoneForm">
            <div class="row">

  <script>
    const apiUrl = "https://script.google.com/macros/s/AKfycbzWeXrCz54CQtqB6uMNTQe6lG7oVuy5Fq7rtfuzq58m6aktY8SCtMNiN0cCyTQH72Ashg/exec";

    const formData = { name: '', email: '', phone: '', homeschool: '' };
    let currentStep = 1;

    function goToStep(stepNumber) {
      currentStep = stepNumber;
      document.querySelectorAll('.form-step').forEach(step => step.style.display = 'none');
      document.getElementById(`step${stepNumber}`).style.display = 'block';
      document.getElementById('stepIndicator').textContent = `${stepNumber} of 4`;
      document.querySelectorAll('.pagination_lp i').forEach((icon, index) => {
        icon.classList.toggle('active', index + 1 === stepNumber);
      });
    }
    goToStep(1);

    // Step 1
    document.getElementById('nextToEmail').addEventListener('click', function () {
      const name = document.getElementById('name').value.trim();
      if (name.length < 3 || name.length > 20 || /[^a-zA-Z\s]/.test(name)) {
        document.getElementById('nameErrorMsg').textContent = "Please enter a valid full name (3–20 letters).";
        return;
      }
      document.getElementById('nameErrorMsg').textContent = "";
      formData.name = name;
      goToStep(2);
    });
    document.getElementById('backToName').addEventListener('click', () => goToStep(1));

    // Step 2
    document.getElementById('nextToPhone').addEventListener('click', function () {
      const email = document.getElementById('email').value.trim();
      const regex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      if (!regex.test(email)) {
        document.getElementById('emailErrorMsg').textContent = "Please enter a valid email address.";
        return;
      }
      document.getElementById('emailErrorMsg').textContent = "";
      formData.email = email;
      goToStep(3);
    });
    document.getElementById('backToEmail').addEventListener('click', () => goToStep(2));

    // Step 3: Phone
    document.getElementById("countryCode").addEventListener("input", function () {
      this.value = this.value.replace(/[^+\d]/g, "");
    });

    document.getElementById("phone").addEventListener("input", function () {
      this.value = this.value.replace(/\D/g, "");
    });

    document.getElementById("nextToHomeschool").addEventListener("click", function () {
      let countryCode = document.getElementById("countryCode").value.trim();
      let phoneNumber = document.getElementById("phone").value.trim();
      let errorMsg = document.getElementById("phoneErrorMsg");
      let codeRegex = /^\+\d{1,10}$/;
      let phoneRegex = /^\d{6,20}$/;

      if (!codeRegex.test(countryCode)) {
        errorMsg.textContent = "Please enter a valid country code (e.g. +91)";
        return;
      }
      if (!phoneRegex.test(phoneNumber)) {
        errorMsg.textContent = "Please enter a valid phone number (6–12 digits)";
        return;
      }
      errorMsg.textContent = "";
      formData.phone = countryCode.replace("+", "") + " " + phoneNumber;
      goToStep(4);
    });

    document.getElementById('backToPhone').addEventListener('click', () => goToStep(3));

    // Step 4: Homeschool options
    const homeschoolOptions = [
      { id: "yes", label: "Yes" },
      { id: "no", label: "No" },
      { id: "considering", label: "I’m considering" },
      { id: "noChildren", label: "I don’t have any children" }
    ];

    const radioContainer = document.getElementById("radioContainer");
    homeschoolOptions.forEach(opt => {
      const div = document.createElement("div");
      div.className = "mb-3 form-check";
      const input = document.createElement("input");
      input.type = "radio";
      input.className = "form-check-input custom-radio";
      input.id = opt.id;
      input.name = "homeschool";
      input.value = opt.label;
      const label = document.createElement("label");
      label.className = "form-check-label";
      label.setAttribute("for", opt.id);
      label.textContent = opt.label;
      div.appendChild(input);
      div.appendChild(label);
      radioContainer.appendChild(div);
    });

    // Submit form

    document.getElementById('submitAll').addEventListener('click', () => {
      const selected = document.querySelector('input[name="homeschool"]:checked');
      if (!selected) {
        document.getElementById('homeschoolErrorMsg').textContent = "Please select an option.";
        return;
      }

      document.getElementById('homeschoolErrorMsg').textContent = "";
      formData.homeschool = selected.value;

      const submitBtn = document.getElementById('submitAll');
      submitBtn.disabled = true;              // disable button
      submitBtn.textContent = 'Submitting…';  // show loading text

      const now = new Date();
      const formattedDate = now.getFullYear() + '-' +
        String(now.getMonth() + 1).padStart(2, '0') + '-' +
        String(now.getDate()).padStart(2, '0') + ' ' +
        String(now.getHours()).padStart(2, '0') + ':' +
        String(now.getMinutes()).padStart(2, '0') + ':' +
        String(now.getSeconds()).padStart(2, '0');

      const payload = {
        name: formData.name,
        email: formData.email,
        phone: formData.phone,
        homeschool: formData.homeschool,
        dateTime: formattedDate
      };

      console.log("Payload:", payload);

      fetch(apiUrl, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      })
        .then(() => {
          // redirect to thank you page
          window.location.href = "thankyou_page.html";
        })
        .catch(err => {
          console.error(err);
          alert("Failed to send data. Make sure the script is deployed as 'Anyone, even anonymous'.");
          submitBtn.disabled = false;          // re-enable button
          submitBtn.textContent = 'Submit';    // reset text
        });
    });
